name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Susun folder
        run: |
          mkdir -p app/src/main/java/com/eduwar/novicedream
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mv app-build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java app/src/main/java/com/eduwar/novicedream/
          mv index.html app/src/main/assets/
          mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NoviceDream-APK
          path: app/build/outputs/apk/debug/app-debug.apk
