plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eduwar.novicedream'
    compileSdk 35

    defaultConfig {
        applicationId 'com.eduwar.novicedream'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '8.12.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
